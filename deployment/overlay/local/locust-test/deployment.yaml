apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: locust
  labels:
    app: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: localhost:32000/locust
          ports:
            - containerPort: 8089
          command: ["/bin/bash"]
          args: ["-c", "sleep infinity"]
          stdin: true
          tty: true
